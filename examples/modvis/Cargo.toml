[package]
name = "modvis"
version = "0.0.0"
authors = ["David Tolnay <dtolnay@gmail.com>"]
edition = "2021"
publish = false
description = "Module export view: decide item visibility for an observer module path, built on syn"

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }

[dependencies.syn]
default-features = false
features = ["full", "parsing", "printing"]
path = "../.."
